[package]
name = "rest-reminder"
version = "0.1.0"
description = "休息提醒助手 - 后台守护你的工作节奏"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rdev = "0.5"
dirs = "5"

[features]
# 默认不启用任何特殊 feature；生产由 tauri 注入 custom-protocol
default = []

# 仅 Windows 编译：开机自启动写注册表
[target.'cfg(windows)'.dependencies]
winreg = "0.52"
